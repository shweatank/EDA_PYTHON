<!DOCTYPE html>
<html>
<head>
    <title>Logs</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0d0d0d;
            color: white;
            padding: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #111;
            box-shadow: 0 0 20px #0ff;
        }
        th, td {
            border: 1px solid #0ff;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #222;
            color: #0ff;
        }
        td {
            max-width: 500px;
            word-wrap: break-word;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            border: 2px solid #0ff;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }
        .back-btn:hover {
            background-color: #0ff;
            color: black;
        }
    </style>
</head>
<body>
    <h1>📜 Action Logs</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Timestamp</th>
            <th>Operation</th>
            <th>Task</th>
            <th>Status</th>
            <th>Result</th>
        </tr>
        {% for log in logs %}
        <tr>
            <td>{{ log[0] }}</td>
            <td>{{ log[1] }}</td>
            <td>{{ log[2] }}</td>
            <td>{{ log[3] }}</td>
            <td>{{ log[4] }}</td>
            <td>{{ log[5] }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/" class="back-btn">⬅️ Back to Home</a>
</body>
</html>
