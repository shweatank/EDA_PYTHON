<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Gate Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .log-output {
            height: 300px;
            overflow-y: auto;
            background-color: #f8f9fa;
            border-radius: 5px;
            padding: 10px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .test-pass {
            color: green;
        }
        .test-fail {
            color: red;
        }
        .history-row {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Logic Gate Tester</h1>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5>Test Configuration</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <select id="gateSelect" class="form-select">
                            <option value="and">AND Gate</option>
                            <option value="or">OR Gate</option>
                            <option value="not">NOT Gate</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button id="runTestBtn" class="btn btn-primary">Run Test</button>
                    </div>
                    <div class="col-md-4">
                        <button id="viewWaveBtn" class="btn btn-secondary" disabled>View Waveform</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5>Test Results</h5>
            </div>
            <div class="card-body">
                <div id="testResult" class="mb-3"></div>
                <div id="testOutput" class="log-output">No test results yet...</div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5>Test History</h5>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Gate</th>
                            <th>Result</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                        <!-- History will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gateSelect = document.getElementById('gateSelect');
            const runTestBtn = document.getElementById('runTestBtn');
            const viewWaveBtn = document.getElementById('viewWaveBtn');
            const testResult = document.getElementById('testResult');
            const testOutput = document.getElementById('testOutput');
            const historyTable = document.getElementById('historyTable');
            
            let currentGate = '';
            let currentVcdAvailable = false;
            
            // Load test history
            loadHistory();
            
            // Run test button
            runTestBtn.addEventListener('click', function() {
                currentGate = gateSelect.value;
                runTestBtn.disabled = true;
                testOutput.textContent = "Running test...";
                testResult.innerHTML = '';
                
                fetch('/run_test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        gate: currentGate
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        // Display results
                        testResult.innerHTML = `
                            <div class="alert ${data.result === 'PASSED' ? 'alert-success' : 'alert-danger'}">
                                <strong>${data.gate.toUpperCase()} Gate Test ${data.result}</strong>
                            </div>
                        `;
                        testOutput.textContent = data.output;
                        currentVcdAvailable = data.vcd_available;
                        viewWaveBtn.disabled = !data.vcd_available;
                        
                        // Refresh history
                        loadHistory();
                    } else {
                        testOutput.textContent = "Error: " + (data.message || "Unknown error");
                    }
                    runTestBtn.disabled = false;
                })
                .catch(error => {
                    testOutput.textContent = "Error: " + error;
                    runTestBtn.disabled = false;
                });
            });
            
            // View waveform button
            viewWaveBtn.addEventListener('click', function() {
                if (!currentGate) return;
                
                fetch('/view_waveform', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        gate: currentGate
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status !== 'success') {
                        alert(data.message);
                    }
                });
            });
            
            // Load history function
            function loadHistory() {
                fetch('/get_history')
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            updateHistoryTable(data.history);
                        }
                    });
            }
            
            // Update history table
            function updateHistoryTable(history) {
                historyTable.innerHTML = '';
                history.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = 'history-row';
                    
                    // Timestamp
                    const timeCell = document.createElement('td');
                    timeCell.textContent = item.timestamp;
                    
                    // Gate
                    const gateCell = document.createElement('td');
                    gateCell.textContent = item.gate_type.toUpperCase();
                    
                    // Result
                    const resultCell = document.createElement('td');
                    resultCell.textContent = item.result;
                    resultCell.className = item.result === 'PASSED' ? 'test-pass' : 'test-fail';
                    
                    // Actions
                    const actionCell = document.createElement('td');
                    if (item.vcd_file) {
                        const viewBtn = document.createElement('button');
                        viewBtn.className = 'btn btn-sm btn-outline-primary';
                        viewBtn.textContent = 'View Wave';
                        viewBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            fetch('/view_waveform', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({
                                    gate: item.gate_type
                                })
                            });
                        });
                        actionCell.appendChild(viewBtn);
                    }
                    
                    // Click to show details
                    row.addEventListener('click', () => {
                        currentGate = item.gate_type;
                        testResult.innerHTML = `
                            <div class="alert ${item.result === 'PASSED' ? 'alert-success' : 'alert-danger'}">
                                <strong>${item.gate_type.toUpperCase()} Gate Test ${item.result}</strong>
                                <div>${item.timestamp}</div>
                            </div>
                        `;
                        currentVcdAvailable = item.vcd_file !== null;
                        viewWaveBtn.disabled = !currentVcdAvailable;
                    });
                    
                    row.appendChild(timeCell);
                    row.appendChild(gateCell);
                    row.appendChild(resultCell);
                    row.appendChild(actionCell);
                    historyTable.appendChild(row);
                });
            }
        });
    </script>
</body>
</html>
