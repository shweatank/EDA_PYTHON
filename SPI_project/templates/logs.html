<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📄 SPI Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            font-family: 'Courier New', Courier, monospace;
        }
        .glass {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white">

    <div class="glass max-w-6xl w-full p-8 text-left">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-4xl font-bold text-cyan-300">📄 Log Output</h1>
            <a href="/" class="bg-cyan-600 hover:bg-cyan-800 transition px-4 py-2 rounded text-white font-medium">⬅ Back to Dashboard</a>
        </div>

        <div class="bg-gray-900 text-green-300 p-6 rounded-lg overflow-y-auto max-h-[600px] shadow-inner border border-cyan-400">
            <pre class="whitespace-pre-wrap">{{ logs }}</pre>
        </div>
    </div>

</body>
</html>
