<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🚀 EDA Automation(Test)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }
        .glow-btn {
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 0 rgba(0, 255, 163, 0);
        }
        .glow-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 163, 0.8);
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white">

    <div class="glass w-full max-w-6xl p-10 space-y-8 text-center">
        <h1 class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-300 via-lime-200 to-yellow-300">
            🔧 EDA Automation-SPI Protocol Test
        </h1>

        <div class="flex flex-wrap justify-center gap-6">
            <button onclick="trigger('/run_test')" class="bg-gradient-to-br from-green-400 to-green-600 px-6 py-3 rounded-xl text-white text-lg glow-btn">▶️ RTL Verification</button>
            <button onclick="trigger('/run_synthesis')" class="bg-gradient-to-br from-cyan-400 to-cyan-600 px-6 py-3 rounded-xl text-white text-lg glow-btn">💡 Run Synthesis</button>
            <button onclick="trigger('/view_waveform')" class="bg-gradient-to-br from-purple-500 to-indigo-700 px-6 py-3 rounded-xl text-white text-lg glow-btn">📈 View GTKWave</button>
            <button onclick="trigger('/verify_ml')" class="bg-gradient-to-br from-yellow-400 to-yellow-600 px-6 py-3 rounded-xl text-white text-lg glow-btn">🔬 Verification with ML</button>
            <button onclick="trigger('/netlist_validation')" class="bg-gradient-to-br from-orange-400 to-orange-600 px-6 py-3 rounded-xl text-white text-lg glow-btn">🧪 Netlist Validation</button>
            <button onclick="window.location='/log_output'" class="bg-gradient-to-br from-gray-600 to-gray-800 px-6 py-3 rounded-xl text-white text-lg glow-btn">📄 View Logs</button>
            <button onclick="window.location='/db_logs'" class="bg-gradient-to-br from-pink-500 to-rose-700 px-6 py-3 rounded-xl text-white text-lg glow-btn">📊 View DB Logs</button>
        </div>

        <div id="status" class="text-2xl font-semibold mt-6 flex justify-center items-center gap-3 min-h-[2.5rem]"></div>

        <div id="outputContainer" class="bg-gray-900 text-green-300 font-mono text-base rounded-xl p-6 overflow-auto max-h-[400px] shadow-inner hidden">
            <pre id="output" class="whitespace-pre-wrap text-left"></pre>
        </div>
    </div>

    <script>
        function trigger(endpoint) {
            const outputContainer = document.getElementById('outputContainer');
            const outputEl = document.getElementById('output');
            const statusEl = document.getElementById('status');

            outputContainer.classList.add('hidden');
            outputEl.textContent = '';
            statusEl.innerHTML = '<div class="loader"></div><span>Running...</span>';

            fetch(endpoint, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        statusEl.innerHTML = '<span class="text-green-400 text-3xl">✅ Passed</span>';
                        outputEl.textContent = data.output;
                    } else {
                        statusEl.innerHTML = '<span class="text-red-400 text-3xl">❌ Failed</span>';
                        outputEl.textContent = data.output;
                    }
                    outputContainer.classList.remove('hidden');
                })
                .catch(err => {
                    statusEl.innerHTML = '<span class="text-red-600 text-3xl">❌ Error</span>';
                    outputEl.textContent = 'Error: ' + err;
                    outputContainer.classList.remove('hidden');
                });
        }
    </script>
</body>
</html>
